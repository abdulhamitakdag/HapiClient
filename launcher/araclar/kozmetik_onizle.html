<!doctype html>
<meta charset="utf-8">
<body style="margin:0;background:#101512">
<script>
const { ipcRenderer } = require('electron')
const path = require('path')
window.onerror = (m, k, s) => ipcRenderer.send('hata', m + ' @' + k + ':' + s)
window.addEventListener('unhandledrejection', e => ipcRenderer.send('hata', String(e.reason && e.reason.stack || e.reason)))
const K = require(path.join(__dirname, '..', 'app', 'assets', 'js', 'hapi', 'kozmetik'))
const { KozmetikSahnesi } = require(path.join(__dirname, '..', 'app', 'assets', 'js', 'hapi', 'kozmetik3b'))
const p = new URLSearchParams(location.search)
const sutun = parseInt(p.get('sutun'), 10), filtre = p.get('filtre')
const B = 300, Y = 380
const liste = K.katalog().filter(k => !filtre || k.yuva === filtre || k.kimlik === filtre)
const tuval = document.createElement('canvas')
tuval.style.width = B + 'px'
tuval.style.height = Y + 'px'
document.body.appendChild(tuval)
const sahne = new KozmetikSahnesi(tuval)
sahne.boyutla()
const sayfa = document.createElement('canvas')
sayfa.width = B * Math.min(sutun, liste.length)
sayfa.height = Y * Math.ceil(liste.length / sutun)
const ctx = sayfa.getContext('2d')
ctx.fillStyle = '#101512'
ctx.fillRect(0, 0, sayfa.width, sayfa.height)
const bekle = ms => new Promise(c => setTimeout(c, ms))
;(async () => {
    for(let i = 0; i < liste.length; i++){
        const k = liste[i]
        sahne.secimAyarla({ [k.yuva]: k.kimlik })
        sahne.yuvayaBak(k.yuva)
        sahne.yaw = sahne.hedefYaw
        sahne.elle = true
        await bekle(350) // dokular yüklensin
        sahne.ciz(37 + i * 3)
        ctx.drawImage(tuval, (i % sutun) * B, Math.floor(i / sutun) * Y, B, Y)
        ctx.fillStyle = '#fff'
        ctx.font = '14px sans-serif'
        ctx.fillText(k.ad, (i % sutun) * B + 8, Math.floor(i / sutun) * Y + 18)
    }
    ipcRenderer.send('bitti', sayfa.toDataURL('image/png'))
})()
</script>
