name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    name: Kurulum dosyası (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Testler
        run: npm test

      - name: Kurulum dosyasını derle
        run: npx electron-builder build -w --publish never

      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/HapiClient-kurulum-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.FullName).sha256"
          Write-Host "SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: hapiclient-kurulum
          path: |
            launcher/dist/HapiClient-kurulum-*.exe
            launcher/dist/HapiClient-kurulum-*.exe.sha256
            launcher/dist/HapiClient-kurulum-*.exe.blockmap
            launcher/dist/latest.yml

      - name: Release oluştur
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: HapiClient ${{ github.ref_name }}
          files: |
            launcher/dist/HapiClient-kurulum-*.exe
            launcher/dist/HapiClient-kurulum-*.exe.sha256
            launcher/dist/HapiClient-kurulum-*.exe.blockmap
            launcher/dist/latest.yml
          body: |
            ## Ne indireceğim?

            Aşağıdaki **Assets** listesinden yalnızca **`HapiClient-kurulum-*.exe`**
            dosyasını indirin. Başka bir dosyaya ihtiyacınız yok.

            - Dosyaya çift tıklayın: HapiClient kendiliğinden kurulur ve açılır.
            - Masaüstüne ve Başlat menüsüne kısayol eklenir.
            - Windows 10 / 11, 64 bit gerekir.
            - Takma adınızı yazıp **OYNA**'ya basın; oyun, modlar ve Java kendiliğinden iner.

            Windows ilk açılışta "bilgisayarınızı korudu" (SmartScreen) uyarısı
            gösterebilir. Bu, dosyanın virüslü olduğu anlamına gelmez; programın
            ücretli bir kod imzalama sertifikası olmadığı için çıkar.
            **Daha fazla bilgi → Yine de çalıştır** ile devam edebilirsiniz.

            ### Diğer dosyalar

            | Dosya | Kime gerekli |
            |---|---|
            | `HapiClient-kurulum-*.exe` | **Oyuncular** — indirip çalıştıracağınız dosya |
            | `HapiClient-kurulum-*.exe.sha256` | Dosyayı doğrulamak isteyenler |
            | `latest.yml`, `*.blockmap` | Otomatik güncelleme; elle indirmeniz gerekmez |

            Bu sürümün dosyaları GitHub Actions üzerinde, bu depodaki kaynaktan üretildi.
